[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-loan-approval-system"
version = "0.1.0"
description = "Agentic AI Intelligent Loan Approval System using LangGraph and Claude"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Anthropic", email = "support@anthropic.com"}
]

dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "httpx>=0.25.2",
    "streamlit>=1.28.1",
    "streamlit-extras>=0.3.5",
    "langgraph>=0.0.50",
    "langchain>=0.1.14",
    "langchain-anthropic>=0.1.14",
    "langchain-community>=0.0.36",
    "fastmcp>=0.8.0",
    "anthropic>=0.25.4",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.23",
    "python-dotenv>=1.0.0",
    "python-json-logger>=2.0.7",
    "pytz>=2023.3.post1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.1",
    "pytest-mock>=3.12.0",
    "mypy>=1.7.1",
    "flake8>=6.1.0",
    "black>=23.12.1",
    "isort>=5.13.2",
    "ipython>=8.17.2",
    "ipdb>=0.13.13",
]

[project.urls]
Homepage = "https://github.com/anthropics/ai-loan-approval-system"
Documentation = "https://github.com/anthropics/ai-loan-approval-system/blob/main/README.md"
Repository = "https://github.com/anthropics/ai-loan-approval-system.git"

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=src --cov-report=term-missing"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 120

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/test_*.py"]
